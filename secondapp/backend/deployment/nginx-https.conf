server {
    listen 80;
    listen [::]:80;
    server_name api.soccerarena.org 139.59.93.218;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/soccerarena-acme;
        try_files $uri =404;
    }
    location / { return 308 https://api.soccerarena.org$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.soccerarena.org;
    ssl_certificate /etc/letsencrypt/live/api.soccerarena.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.soccerarena.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/soccerarena-error.log warn;
    client_max_body_size 1m;

    location /static/ {
        alias /srv/soccerarena/current/staticfiles/;
        add_header Access-Control-Allow-Origin '*' always;
    }
    location / {
        include /etc/nginx/snippets/soccerarena-proxy.conf;
    }
}
