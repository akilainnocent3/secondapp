# Place limit zones in http {}. Verify certificate paths after issuing TLS.
limit_req_zone $binary_remote_addr zone=arena_auth:10m rate=5r/m;
server {
    listen 80;
    server_name soccerarena.org api.soccerarena.org;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name api.soccerarena.org;
    ssl_certificate /etc/letsencrypt/live/api.soccerarena.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.soccerarena.org/privkey.pem;
    client_max_body_size 64k;
    limit_req_status 429;
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"error":{"code":"throttled","message":"Please wait before trying again.","fields":{}}}';
    }
    # No query strings, request bodies or authorization headers in access logs.
    access_log off;
    location /static/ { alias /srv/soccerarena/current/backend/staticfiles/; }
    location ~ ^/api/v1/auth/(login|web/login|register|refresh)/$ {
        limit_req zone=arena_auth burst=10 nodelay;
        include /etc/nginx/snippets/soccerarena-proxy.conf;
    }
    location / { include /etc/nginx/snippets/soccerarena-proxy.conf; }
}
server {
    listen 443 ssl;
    server_name soccerarena.org;
    ssl_certificate /etc/letsencrypt/live/soccerarena.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/soccerarena.org/privkey.pem;
    root /srv/soccerarena/current/flutter/build/web;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    location = /index.html { add_header Cache-Control 'no-cache'; }
    location ~* \.(js|mjs|wasm|json|css|png|jpg|jpeg|svg|ico|ttf|otf|woff2?|map|bin)$ {
        try_files $uri =404;
        add_header Cache-Control 'no-cache';
    }
    location /assets/ { try_files $uri =404; }
    location /canvaskit/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
